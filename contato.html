<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/estilo.css">

</head>
<body>

<header class="topo">
    <button id="menu-toggle" type="button" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">☰</button>
    <nav id="menu" aria-label="Menu principal">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="links.html">Produtos</a></li>
            <li><a href="contato.html" aria-current="page">Contato</a></li>
        </ul>
    </nav>
</header>

<h1>Contato</h1>
<p>E-mail: contato@techparts.com.br<br>
Telefone: (19) 99999-0000</p>

<p><a href="index.html">Voltar para o site TechParts</a></p>

<h1>Nos dê seu feedback:</h1>

<form id="form-contato" novalidate>
  <fieldset>
    <legend>Informações de contato</legend>

    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome" autocomplete="name" aria-describedby="erro-nome">
    <span class="erro" id="erro-nome"></span><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" autocomplete="email" aria-describedby="erro-email">
    <span class="erro" id="erro-email"></span><br>

    <label for="comentarios">Comentários:</label><br>
    <textarea id="comentarios" name="comentarios" rows="5" cols="40" placeholder="Digite seus cometários aqui..." aria-describedby="erro-comentarios"></textarea>
    <small id="contador">0/500</small>
    <span class="erro" id="erro-comentarios"></span><br>

    <button type="submit">Envie o feedback</button>
    <p id="status-form" class="status" role="status"></p>
  </fieldset>
</form>

<script src="js/script.js"></script>
</body>
</html>
